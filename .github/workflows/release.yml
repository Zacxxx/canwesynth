name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - run: git archive --format=tar.gz --prefix=canwesynth-${GITHUB_REF_NAME}/ -o canwesynth-${GITHUB_REF_NAME}.tar.gz HEAD
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: canwesynth-${{ github.ref_name }}.tar.gz
