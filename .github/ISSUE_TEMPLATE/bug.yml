name: Bug report
description: Report a reproducible problem
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the smallest reproducible example.
    validations:
      required: true
  - type: input
    attributes:
      label: CanWeSynth version or commit
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Surface
      options:
        - Linux standalone/JACK
        - Native Linux VST3
        - CLAP
        - Windows VST3
        - FL Studio under Wine/Proton
        - Instrument schema/CLI
        - Codex plugin/MCP
        - Codex app-server bridge
  - type: textarea
    attributes:
      label: Environment
      description: OS, DAW, audio backend, Wine/Proton version, and hardware where relevant.
  - type: textarea
    attributes:
      label: Logs or instrument
      description: Remove tokens and private data before attaching files.
